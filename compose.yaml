# Homepress stack — web (Next.js) + worker (Node) only.
# Appwrite and mail are EXTERNAL — never spawned by this stack.
#
# Pull prebuilt images (Komodo / production-ish):
#   podman compose pull && podman compose up -d
#
# Or build from local source:
#   podman compose build && podman compose up -d
#
# Required env (from root .env via env_file — works at container start, no rebuild):
#   NEXT_PUBLIC_APPWRITE_ENDPOINT, NEXT_PUBLIC_APPWRITE_PROJECT_ID,
#   NEXT_PUBLIC_APPWRITE_PROJECT_NAME, APPWRITE_API_KEY, OPENROUTER_API_KEY
# See .env.example for SMTP / APP_PUBLIC_URL and optional knobs.

services:
  web:
    image: ghcr.io/darticusmaximus/homepress-web:0.1.4
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: homepress-web
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: ghcr.io/darticusmaximus/homepress-worker:0.1.4
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: homepress-worker
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kill", "-0", "1"]
      interval: 15s
      timeout: 3s
      retries: 5
