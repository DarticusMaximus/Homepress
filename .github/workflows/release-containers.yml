# Build and push Homepress container images to GHCR.
# Images: ghcr.io/<owner>/homepress-web and ghcr.io/<owner>/homepress-worker
#
# Native amd64 build on ubuntu-latest (no QEMU, no platforms: list).
# Base images use the node:22-alpine *manifest list* digest so the runner
# pulls linux/amd64 and a local Apple Silicon box still pulls linux/arm64.

name: Release containers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: web/Dockerfile
          - name: worker
            dockerfile: worker/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and image owner
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} owner=${OWNER}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.version.outputs.owner }}/homepress-${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }}-alpha
            type=raw,value=latest
            type=raw,value=alpha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=homepress-${{ matrix.name }}-native-v2
          cache-to: type=gha,mode=max,scope=homepress-${{ matrix.name }}-native-v2
